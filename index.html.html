<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>

<title>دليل لون الشريط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&display=swap">
<style>
/* Layout: one narrow column for a phone scanned at a shelf. A language bar, then a 2x2 grid of the four label indicators (heat, cold, humidity, UV), the actions for every indicator that changed, a "products moved" confirmation that writes a case record, then the shared case log. Text direction and fonts follow the chosen language. */
:root {
  --bg: #f3f5f6;
  --surface: #ffffff;
  --fg: #16202a;
  --muted: #55626d;
  --line: #d5dce1;
  --accent: #1f4e79;
  --on-accent: #ffffff;
  --bad: #b3372a;
  --c-temp: #e8844f;
  --c-cold: #5b8fd1;
  --c-hum: #5fa85a;
  --c-uv: #8e6bc9;
  --font-display: "Readex Pro", "IBM Plex Sans Arabic", "Noto Sans Arabic", "Noto Sans Devanagari", "Noto Sans Bengali", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Noto Sans Arabic", "Noto Sans Devanagari", "Noto Sans Bengali", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151a;
    --surface: #182027;
    --fg: #e9eef2;
    --muted: #9eaeba;
    --line: #2b3640;
    --accent: #7db7e8;
    --on-accent: #0f151a;
    --bad: #f08577;
    --c-temp: #f09a6a;
    --c-cold: #7aa8e3;
    --c-hum: #7cc277;
    --c-uv: #a98ad8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151a;
  --surface: #182027;
  --fg: #e9eef2;
  --muted: #9eaeba;
  --line: #2b3640;
  --accent: #7db7e8;
  --on-accent: #0f151a;
  --bad: #f08577;
  --c-temp: #f09a6a;
  --c-cold: #7aa8e3;
  --c-hum: #7cc277;
  --c-uv: #a98ad8;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.7;
  padding-inline: 16px;
  padding-block: 20px 40px;
}
.wrap { max-width: 520px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }
.wrap > * { min-width: 0; }

.langs { display: flex; flex-wrap: wrap; gap: 6px; }
.lang { font: inherit; font-size: 14px; line-height: 1.4; padding: 4px 12px; min-height: 36px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; cursor: pointer; }
.lang[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }

.head { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-size: 13px; letter-spacing: 0.04em; color: var(--muted); font-weight: 500; }
h1 { font-family: var(--font-display); font-size: 28px; line-height: 1.4; margin: 0; font-weight: 700; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); }

.pick { display: flex; flex-direction: column; gap: 10px; }
.pick-label { font-family: var(--font-display); font-weight: 600; font-size: 16px; margin: 0; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

.opt {
  --c: var(--accent);
  display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
  width: 100%; text-align: start;
  background: var(--surface); color: var(--fg);
  border: 2px solid var(--line); border-radius: 10px;
  padding: 12px; min-height: 132px;
  font: inherit; cursor: pointer;
  transition: border-color .15s, background-color .15s;
}
.opt[data-k="temp"] { --c: var(--c-temp); }
.opt[data-k="cold"] { --c: var(--c-cold); }
.opt[data-k="hum"] { --c: var(--c-hum); }
.opt[data-k="uv"] { --c: var(--c-uv); }
.opt:hover { border-color: var(--muted); }
.opt:focus-visible, .btn:focus-visible, .lang:focus-visible, .field input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.dot { flex: none; width: 48px; height: 48px; border-radius: 50%; background: var(--c); display: grid; place-items: center; color: #fff; }
.dot svg { width: 26px; height: 26px; }
.opt-name { font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.4; }
.opt-sub { color: var(--muted); font-size: 13px; line-height: 1.5; }
.opt[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 16%, var(--surface)); }
.opt[aria-pressed="true"] .opt-sub { color: var(--fg); }

.flash { margin: 0; padding: 14px 16px; border-radius: 10px; background: color-mix(in srgb, var(--c-hum) 20%, var(--surface)); border: 1px solid var(--c-hum); }

.results { display: flex; flex-direction: column; gap: 14px; }
.hint { margin: 0; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 16px; }
.card { --c: var(--accent); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card[data-k="temp"] { --c: var(--c-temp); }
.card[data-k="cold"] { --c: var(--c-cold); }
.card[data-k="hum"] { --c: var(--c-hum); }
.card[data-k="uv"] { --c: var(--c-uv); }
.tag { display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; padding: 2px 12px; border-radius: 999px; background: color-mix(in srgb, var(--c) 18%, var(--surface)); color: var(--fg); }
.tag::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
.card h2 { font-family: var(--font-display); font-size: 20px; line-height: 1.45; margin: 0; font-weight: 700; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 10px; }
.steps li { counter-increment: s; display: flex; gap: 12px; align-items: flex-start; }
.steps li::before {
  content: counter(s, decimal);
  flex: none; width: 28px; height: 28px; border-radius: 50%;
  background: var(--accent); color: var(--on-accent);
  font-family: var(--font-display); font-weight: 600; font-size: 14px;
  display: grid; place-items: center; margin-top: 2px;
  font-variant-numeric: tabular-nums;
}
.steps li span { min-width: 0; }

.confirm { background: var(--surface); border: 2px solid var(--accent); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.confirm h2 { font-family: var(--font-display); font-size: 18px; margin: 0; font-weight: 600; }
.confirm p { margin: 0; color: var(--muted); font-size: 15px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-weight: 600; font-size: 15px; }
.field input { font: inherit; padding: 10px 12px; min-height: 48px; border: 2px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); direction: ltr; text-align: start; }
.err { margin: 0; color: var(--bad); font-weight: 600; font-size: 15px; }
.btn { font: inherit; font-family: var(--font-display); font-weight: 600; font-size: 18px; min-height: 54px; border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); cursor: pointer; width: 100%; }
.btn:disabled { opacity: .6; cursor: progress; }

.log { display: flex; flex-direction: column; gap: 12px; }
.log h2 { font-family: var(--font-display); font-size: 20px; margin: 0; font-weight: 700; }
.store { margin: 0; font-size: 13px; color: var(--muted); }
.stats { display: flex; flex-direction: column; gap: 8px; }
.stats-title { font-weight: 600; font-size: 15px; margin: 0; }
.bar-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) 28px; gap: 10px; align-items: center; font-variant-numeric: tabular-nums; }
.bar-row .shelf { font-weight: 600; unicode-bidi: isolate; text-align: end; }
.track { height: 14px; background: var(--line); border-radius: 4px; overflow: hidden; }
.fill { height: 100%; background: var(--accent); border-radius: 4px; }
.cases { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.case { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.case .shelf { font-weight: 600; unicode-bidi: isolate; }
.case .time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.mini-set { display: flex; gap: 4px; }
.mini { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); }
.mini[data-k="temp"] { background: var(--c-temp); }
.mini[data-k="cold"] { background: var(--c-cold); }
.mini[data-k="hum"] { background: var(--c-hum); }
.mini[data-k="uv"] { background: var(--c-uv); }
.empty { margin: 0; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 16px; }

.foot { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }

@media (prefers-reduced-motion: reduce) { .opt { transition: none; } }
</style>

</head>
<body>
<main class="wrap" id="app" lang="ar" dir="rtl">
  <nav class="langs" id="langs" aria-label="اللغة / Language">
    <button class="lang" type="button" data-lang="ar" lang="ar" aria-pressed="false">العربية</button>
    <button class="lang" type="button" data-lang="en" lang="en" aria-pressed="false">English</button>
    <button class="lang" type="button" data-lang="ur" lang="ur" aria-pressed="false">اردو</button>
    <button class="lang" type="button" data-lang="hi" lang="hi" aria-pressed="false">हिन्दी</button>
    <button class="lang" type="button" data-lang="bn" lang="bn" aria-pressed="false">বাংলা</button>
    <button class="lang" type="button" data-lang="fil" lang="fil" aria-pressed="false">Filipino</button>
  </nav>

  <header class="head">
    <span class="eyebrow" data-i18n="eyebrow"></span>
    <h1 data-i18n="h1"></h1>
    <p class="lead" data-i18n="lead"></p>
  </header>

  <section class="pick" aria-labelledby="pl">
    <h2 class="pick-label" id="pl" data-i18n="pick"></h2>
    <div class="grid">
      <button class="opt" id="opt-temp" type="button" data-k="temp" aria-pressed="false">
        <span class="dot" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14.5V5a2 2 0 0 1 4 0v9.5a4 4 0 1 1-4 0z"/></svg></span>
        <span class="opt-name" data-i18n="tempName"></span>
        <span class="opt-sub" data-i18n="tempSub"></span>
      </button>
      <button class="opt" id="opt-cold" type="button" data-k="cold" aria-pressed="false">
        <span class="dot" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M4.2 7l15.6 10M4.2 17L19.8 7"/></svg></span>
        <span class="opt-name" data-i18n="coldName"></span>
        <span class="opt-sub" data-i18n="coldSub"></span>
      </button>
      <button class="opt" id="opt-hum" type="button" data-k="hum" aria-pressed="false">
        <span class="dot" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg></span>
        <span class="opt-name" data-i18n="humName"></span>
        <span class="opt-sub" data-i18n="humSub"></span>
      </button>
      <button class="opt" id="opt-uv" type="button" data-k="uv" aria-pressed="false">
        <span class="dot" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></span>
        <span class="opt-name" data-i18n="uvName"></span>
        <span class="opt-sub" data-i18n="uvSub"></span>
      </button>
    </div>
  </section>

  <p class="flash" id="flash" role="status" hidden></p>

  <section class="results" id="results" aria-live="polite"></section>

  <section class="confirm" id="confirm" aria-labelledby="cl" hidden>
    <h2 id="cl" data-i18n="cH"></h2>
    <p data-i18n="cP"></p>
    <div class="field">
      <label for="shelf" data-i18n="shelfLabel"></label>
      <input id="shelf" type="text" inputmode="text" autocomplete="off" maxlength="24" data-i18n-ph="shelfPh">
    </div>
    <p class="err" id="err" role="alert" hidden></p>
    <button class="btn" id="done" type="button" data-i18n="btn"></button>
  </section>

  <section class="log" aria-labelledby="ll">
    <h2 id="ll" data-i18n="logH"></h2>
    <p class="store" id="store"></p>
    <div class="stats" id="stats"></div>
    <ul class="cases" id="cases"></ul>
  </section>

  <p class="foot" data-i18n="foot"></p>
</main>

          steps: ["বাক্সটি শুকনো জায়গায় নিন, চুইয়ে পড়া পানি ও ভেজা মেঝে থেকে দূরে।", "প্যাকেজিংয়ে ভেজা ভাব, ফোলা বা ছত্রাক আছে কি না দেখুন।", "পাশের বাক্সগুলো পরীক্ষা করুন, আর আর্দ্রতার উৎস জানলে জানান।"] },
        uv: { tag: "অতিবেগুনি রশ্মি", title: "বাক্সটি তীব্র অতিবেগুনি রশ্মির সংস্পর্শে এসেছে", lead: "কিছু পণ্য তীব্র আলোয় ক্ষতিগ্রস্ত হয়, বিশেষ করে ওষুধ ও সংবেদনশীল খাবার।",
          steps: ["বাক্সটি সরাসরি রোদ, জানালা ও তীব্র আলো থেকে সরান।", "পণ্য ও প্যাকেজিংয়ে রং বা আকারের পরিবর্তন দেখুন।", "একই জায়গার বাকি বাক্সগুলো পরীক্ষা করুন।"] }
      }
    },
    fil: {
      dir: "ltr", locale: "fil-PH",
      ui: {
        eyebrow: "Label sa pagsubaybay ng temperatura at halumigmig",
        h1: "Nagbago ba ang kulay ng isang indicator? Ito ang gagawin",
        lead: "Tingnan ang label sa kahon, pagkatapos ay pindutin ang bilog na nagbago ng kulay. Puwede kang pumili ng higit sa isa.",
        pick: "Aling indicator ang nagbago?",
        tempName: "Init", tempSub: "Lampas 30°C (halimbawa)",
        coldName: "Lamig", coldSub: "Wala pang 0°C (halimbawa)",
        humName: "Halumigmig", humSub: "Lampas 60% RH (halimbawa)",
        uvName: "UV na liwanag", uvSub: "Malakas na exposure",
        hint: "Pindutin ang bilog na nagbago ng kulay at lalabas dito ang mga hakbang.",
        cH: "Pagkatapos ilipat ang mga produkto",
        cP: "Itinatala ang kaso kasama ang oras at numero ng shelf, at hindi ito tapos hangga't hindi mo pinipindot ang button.",
        shelfLabel: "Numero ng shelf", shelfPh: "Halimbawa: A-12",
        err: "Ilagay muna ang numero ng shelf.",
        btn: "Nailipat na ang mga produkto",
        flash: "Naitala: nailipat ang mga produkto mula sa shelf {s} ({n}).",
        flashFail: " Hindi nai-save sa pinagsamang talaan, kaya sa device na ito lang nai-save ang kaso.",
        logH: "Talaan ng mga kaso",
        storeLoad: "Nilo-load ang talaan…",
        storeShared: "Ibinabahagi ang talaan sa team at live na nag-a-update.",
        storeLocal: "Sa device na ito lang naka-save ang talaan.",
        storeFail: "Hindi na-load ang pinagsamang talaan. Ipinapakita ang talaang naka-save sa device na ito.",
        empty: "Wala pang naitalang kaso. Lalabas dito ang bawat kaso pagkatapos pindutin ang «Nailipat na ang mga produkto».",
        statsTitle: "Mga shelf na may pinakamaraming kaso",
        foot: "Mga halimbawa mula sa disenyo ng label ang mga limitasyong ipinapakita. Iaakma ang mga hakbang sa patakaran ng bodega at uri ng produkto."
      },
      ind: {
        temp: { tag: "Init", title: "Naabot ng matinding init ang kahon", lead: "Permanente ang pagbabago ng kulay, kaya ituring na nasa panganib ang produkto.",
          steps: ["Ilipat agad ang kahon sa mas malamig na lugar, malayo sa sikat ng araw at pinagmumulan ng init.", "Suriin ang mga kalapit na kahon at tingnan ang kanilang mga indicator.", "Lagyan ng markang «Sinusuri» ang kahon at huwag ilabas hangga't hindi nagpapasya ang supervisor."] },
        cold: { tag: "Lamig", title: "Naabot ng matinding lamig ang kahon", lead: "Maaaring masira ang ilang produkto kapag nagyelo, kahit walang makitang palatandaan sa labas.",
          steps: ["Ilayo ang kahon sa direktang labasan ng lamig o sa sobrang malamig na bahagi.", "Huwag gamitin o ilabas ang produkto hangga't hindi nagpapasya ang supervisor.", "Suriin ang mga katabing kahon at itala ang anumang indicator na nagbago."] },
        hum: { tag: "Halumigmig", title: "Naabot ng mataas na halumigmig ang kahon", lead: "Maaaring masira ng halumigmig ang produkto at packaging kahit mukhang maayos.",
          steps: ["Ilipat ang kahon sa tuyong lugar, malayo sa tagas at basang sahig.", "Tingnan ang packaging kung may basa, umbok, o amag.", "Suriin ang mga katabing kahon, at iulat ang pinagmulan ng halumigmig kung alam mo."] },
        uv: { tag: "UV na liwanag", title: "Naabot ng malakas na UV na liwanag ang kahon", lead: "May mga produktong naaapektuhan ng malakas na liwanag, lalo na ang gamot at sensitibong pagkain.",
          steps: ["Ilayo ang kahon sa direktang sikat ng araw, bintana, at matinding ilaw.", "Tingnan ang produkto at packaging kung may pagbabago sa kulay o hugis.", "Suriin ang iba pang kahon sa parehong lugar."] }
      }
    }
  };

  var LANG_KEY = "strip-lang";
  var lang = "ar";
  var selected = {};
  var cases = [];
  var db = null;
  var storeKey = "storeLoad";
  var LOCAL_KEY = "strip-cases-v1";

  var app = document.getElementById("app");
  var results = document.getElementById("results");
  var confirmBox = document.getElementById("confirm");
  var flash = document.getElementById("flash");
  var shelfInput = document.getElementById("shelf");
  var errEl = document.getElementById("err");
  var doneBtn = document.getElementById("done");
  var storeEl = document.getElementById("store");
  var statsEl = document.getElementById("stats");
  var casesEl = document.getElementById("cases");
  var btns = Array.prototype.slice.call(document.querySelectorAll(".opt"));
  var langBtns = Array.prototype.slice.call(document.querySelectorAll(".lang"));

  function T() { return I18N[lang]; }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function names(keys) { return keys.map(function (k) { return T().ind[k].tag; }).join(lang === "ar" || lang === "ur" ? "، " : ", "); }
  function fmtTime(iso) {
    try {
      return new Date(iso).toLocaleString(T().locale, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    } catch (e) { return iso || ""; }
  }

  /* ---------- language ---------- */
  function pickInitialLang() {
    var saved = null;
    try { saved = localStorage.getItem(LANG_KEY); } catch (e) {}
    if (saved && I18N[saved]) return saved;
    var list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || "ar"];
    for (var i = 0; i < list.length; i++) {
      var p = String(list[i]).toLowerCase().split("-")[0];
      if (p === "tl") p = "fil";
      if (I18N[p]) return p;
    }
    return "ar";
  }

  function applyLang() {
    var t = T();
    app.setAttribute("lang", lang);
    app.setAttribute("dir", t.dir);
    document.documentElement.setAttribute("lang", lang);
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (n) {
      n.textContent = t.ui[n.getAttribute("data-i18n")] || "";
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-ph]"), function (n) {
      n.setAttribute("placeholder", t.ui[n.getAttribute("data-i18n-ph")] || "");
    });
    langBtns.forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang)); });
    storeEl.textContent = t.ui[storeKey] || "";
    flash.hidden = true;
    showErr("");
    renderGuide();
    renderLog();
  }

  /* ---------- guidance ---------- */
  function renderGuide() {
    var keys = ORDER.filter(function (k) { return selected[k]; });
    btns.forEach(function (b) { b.setAttribute("aria-pressed", String(!!selected[b.getAttribute("data-k")])); });
    confirmBox.hidden = !keys.length;
    if (!keys.length) {
      results.textContent = "";
      results.appendChild(el("p", "hint", T().ui.hint));
      return;
    }
    results.textContent = "";
    keys.forEach(function (k) {
      var d = T().ind[k];
      var card = el("article", "card");
      card.setAttribute("data-k", k);
      card.appendChild(el("span", "tag", d.tag));
      card.appendChild(el("h2", null, d.title));
      card.appendChild(el("p", null, d.lead));
      var ol = el("ol", "steps");
      d.steps.forEach(function (s) { var li = el("li"); li.appendChild(el("span", null, s)); ol.appendChild(li); });
      card.appendChild(ol);
      results.appendChild(card);
    });
  }

  /* ---------- log ---------- */
  function renderLog() {
    statsEl.textContent = "";
    casesEl.textContent = "";
    if (!cases.length) {
      casesEl.appendChild(el("li", "empty", T().ui.empty));
      return;
    }
    var counts = {};
    cases.forEach(function (c) { counts[c.shelf] = (counts[c.shelf] || 0) + 1; });
    var top = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; }).slice(0, 5);
    var max = counts[top[0]];
    statsEl.appendChild(el("p", "stats-title", T().ui.statsTitle));
    top.forEach(function (s) {
      var row = el("div", "bar-row");
      row.appendChild(el("span", "shelf", s));
      var track = el("div", "track");
      var fill = el("div", "fill");
      fill.style.width = Math.round(counts[s] / max * 100) + "%";
      track.appendChild(fill);
      row.appendChild(track);
      row.appendChild(el("span", "num", String(counts[s])));
      statsEl.appendChild(row);
    });
    cases.slice(0, 10).forEach(function (c) {
      var li = el("li", "case");
      li.appendChild(el("span", "shelf", c.shelf));
      var set = el("span", "mini-set");
      var ks = (c.indicators || []).filter(function (k) { return T().ind[k]; });
      set.setAttribute("aria-label", names(ks));
      ks.forEach(function (k) {
        var m = el("span", "mini"); m.setAttribute("data-k", k); set.appendChild(m);
      });
      li.appendChild(set);
      li.appendChild(el("span", "time", fmtTime(c.movedAt)));
      casesEl.appendChild(li);
    });
  }

  function readLocal() {
    try { var r = JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]"); return Array.isArray(r) ? r : []; }
    catch (e) { return []; }
  }
  function saveLocal(rec) {
    cases = [rec].concat(cases).slice(0, 50);
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(cases)); } catch (e) {}
    renderLog();
  }
  function setStore(k) { storeKey = k; storeEl.textContent = T().ui[k] || ""; }

  /* ---------- confirm ---------- */
  function showFlash(text) { flash.textContent = text; flash.hidden = false; }
  function showErr(text) { errEl.textContent = text; errEl.hidden = !text; }

  async function onDone() {
    var keys = ORDER.filter(function (k) { return selected[k]; });
    var shelf = shelfInput.value.trim();
    if (!keys.length) return;
    if (!shelf) { showErr(T().ui.err); shelfInput.focus(); return; }
    showErr("");
    doneBtn.disabled = true;
    var rec = { shelf: shelf, indicators: keys, movedAt: new Date().toISOString(), status: "done" };
    var shared = false;
    if (db) {
      try { await db.collection("cases").add(rec); shared = true; } catch (e) { shared = false; }
    }
    if (!shared) saveLocal(rec);
    var msg = T().ui.flash.replace("{s}", shelf).replace("{n}", names(keys));
    if (db && !shared) msg += T().ui.flashFail;
    showFlash(msg);
    selected = {};
    renderGuide();
    doneBtn.disabled = false;
  }

  /* ---------- wiring ---------- */
  btns.forEach(function (b) {
    b.addEventListener("click", function () {
      var k = b.getAttribute("data-k");
      selected[k] = !selected[k];
      flash.hidden = true;
      showErr("");
      renderGuide();
    });
  });
  langBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      lang = b.getAttribute("data-lang");
      try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
      applyLang();
    });
  });
  doneBtn.addEventListener("click", onDone);

  /* shelf id comes from the QR link: …#A-12 */
  var h = (location.hash || "").replace("#", "");
  if (h) { try { shelfInput.value = decodeURIComponent(h); } catch (e) { shelfInput.value = h; } }

  lang = pickInitialLang();
  cases = readLocal();
  applyLang();

  async function initStore() {
    try {
      if (window.claude && window.claude.use) db = await window.claude.use("db");
    } catch (e) { db = null; }
    if (!db) { setStore("storeLocal"); return; }
    setStore("storeShared");
    cases = [];
    renderLog();
    try {
      db.collection("cases").orderBy("movedAt", "desc").limit(50).onSnapshot(function (snap) {
        cases = snap.docs.map(function (d) { return d.data(); });
        renderLog();
      }, function () {
        db = null;
        cases = readLocal();
        setStore("storeFail");
        renderLog();
      });
    } catch (e) {
      db = null;
      cases = readLocal();
      setStore("storeLocal");
      renderLog();
    }
  }
  initStore();
})();
</script>
</body>
